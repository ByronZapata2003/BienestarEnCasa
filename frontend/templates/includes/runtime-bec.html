    <!-- Script de Autenticación Múltiple Endpoint Fallback -->
    <script>
(function() {
    window.BEC = window.BEC || {};

    // Configuración global de Endpoints de la API y Vistas HTML
    window.BEC.cfg = {
        api: {
            login: '/api/auth/iniciar-sesion/',
            iniciarSesion: '/api/auth/iniciar-sesion/',
            registro: '/api/auth/registro/',
            servicios: '/api/catalogo/servicios/',
            solicitudes: '/api/solicitudes/',
            direcciones: '/api/usuarios/direcciones/',
            direccion: '/api/usuarios/direcciones/{id}/'
        },
        pages: {
            solicitudCrear: '/solicitud/crear/{id}/'
        }
    };

    // Helper para reemplazar IDs en plantillas de URLs
    window.BEC.url = function(pattern, id) {
        return pattern.replace('{id}', id);
    };

    // Helper para unificar listas devueltas por DRF o paginación
    window.BEC.lista = function(data) {
        if (Array.isArray(data)) return data;
        if (data && Array.isArray(data.results)) return data.results;
        if (data && Array.isArray(data.resultados)) return data.resultados;
        return [];
    };

    // Helper centralizado de Peticiones API con token Bearer
    window.BEC.api = function(url, options) {
        options = options || {};
        options.headers = options.headers || {};

        function getCookie(name) {
            var cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                var cookies = document.cookie.split(';');
                for (var i = 0; i < cookies.length; i++) {
                    var cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        var csrf = getCookie('csrftoken') || document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
        if (csrf && !options.headers['X-CSRFToken']) {
            options.headers['X-CSRFToken'] = csrf;
        }

        if (!options.headers['Content-Type'] && !(options.body instanceof FormData)) {
            options.headers['Content-Type'] = 'application/json';
        }

        try {
            var perfil = JSON.parse(localStorage.getItem('bec_perfil') || '{}');
            var token = perfil.access || perfil.token || perfil.access_token;
            if (token) {
                options.headers['Authorization'] = 'Bearer ' + token;
            }
        } catch(e) {}

        options.credentials = 'same-origin';

        if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
            options.body = JSON.stringify(options.body);
        }

        return fetch(url, options).then(function(res) {
            return res.json().then(function(data) {
                return { ok: res.ok, status: res.status, data: data };
            }).catch(function() {
                return { ok: res.ok, status: res.status, data: null };
            });
        });
    };

    window.BEC.cerrarSesion = function() {
        localStorage.removeItem('bec_perfil');
        window.location.href = "{% url 'pagina-inicio' %}";
    };

    document.addEventListener('DOMContentLoaded', function() {
        var urlPanelProveedor = "{% url 'pagina-panel-proveedor' %}";
        var urlPanelCliente = "{% url 'pagina-perfil' %}";

        document.body.addEventListener('click', function(e) {
            var modal = document.getElementById('modalLogin');
            var vistaLogin = document.getElementById('vistaLoginModal');
            var vistaRegistro = document.getElementById('vistaRegistroModal');

            if (e.target && (e.target.id === 'btn-abrir-login-modal' || e.target.classList.contains('btn-nav-login'))) {
                e.preventDefault();
                if (modal) {
                    modal.classList.add('activo');
                    modal.setAttribute('aria-hidden', 'false');
                }
            }
            if (e.target && e.target.id === 'btnCerrarModal') {
                if (modal) {
                    modal.classList.remove('activo');
                    modal.setAttribute('aria-hidden', 'true');
                }
            }
            if (e.target && e.target.id === 'linkIrARegistro') {
                e.preventDefault();
                if (vistaLogin && vistaRegistro) {
                    vistaLogin.style.display = 'none';
                    vistaRegistro.style.display = 'block';
                }
            }
            if (e.target && e.target.id === 'linkIrALogin') {
                e.preventDefault();
                if (vistaLogin && vistaRegistro) {
                    vistaRegistro.style.display = 'none';
                    vistaLogin.style.display = 'block';
                }
            }
            if (e.target && e.target.id === 'btn-cerrar-sesion') {
                window.BEC.cerrarSesion();
            }
        });

        var btnSubmit = document.getElementById('btnSubmitLogin');
        if (btnSubmit) {
            btnSubmit.addEventListener('click', function() {
                var emailInput = document.getElementById('emailModal');
                var passInput = document.getElementById('passwordModal');
                var msgBox = document.getElementById('mensajesModal');

                var email = emailInput ? emailInput.value.trim() : '';
                var password = passInput ? passInput.value.trim() : '';

                if (!email || !password) {
                    if (msgBox) msgBox.innerHTML = '<div style="color: #ef4444; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.5rem;">Ingresa correo y contraseña.</div>';
                    return;
                }

                btnSubmit.disabled = true;
                btnSubmit.textContent = 'Autenticando...';

                window.BEC.api(window.BEC.cfg.api.login, {
                    method: 'POST',
                    body: { email: email, password: password }
                }).then(function(res) {
                    if (res.ok) {
                        var usuario = res.data.perfil || res.data.usuario || res.data.user || res.data;
                        if (res.data.access) usuario.access = res.data.access;
                        
                        localStorage.setItem('bec_perfil', JSON.stringify(usuario));
                        var rol = (usuario && usuario.rol) ? usuario.rol.toUpperCase() : '';

                        if (rol === 'PROVEEDOR' || rol === 'PRO') {
                            window.location.href = urlPanelProveedor;
                        } else {
                            window.location.href = urlPanelCliente;
                        }
                    } else {
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = 'Iniciar sesión';
                        var errMsj = (res.data && (res.data.detail || res.data.error || res.data.non_field_errors || res.data.mensaje))
                            ? (res.data.detail || res.data.error || res.data.non_field_errors || res.data.mensaje)
                            : 'Correo o contraseña incorrectos.';
                        if (msgBox) msgBox.innerHTML = '<div style="color: #ef4444; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.5rem;">' + errMsj + '</div>';
                    }
                }).catch(function() {
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Iniciar sesión';
                    if (msgBox) msgBox.innerHTML = '<div style="color: #ef4444; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.5rem;">Error al conectar con el servidor.</div>';
                });
            });
        }


        var formRegistro = document.getElementById('registroFormModal');
        if (formRegistro) {
            formRegistro.addEventListener('submit', function(e) {
                e.preventDefault();

                var botonRegistro = formRegistro.querySelector('button[type="submit"]');
                var mensajesRegistro = document.getElementById('mensajesRegistroModal');
                var datos = {
                    nombres: document.getElementById('regNombres').value.trim(),
                    apellidos: document.getElementById('regApellidos').value.trim(),
                    email: document.getElementById('regEmail').value.trim(),
                    rol: document.getElementById('regRol').value,
                    password: document.getElementById('regPassword').value,
                    password_confirmacion: document.getElementById('regPasswordConfirm').value
                };

                function mostrarMensaje(texto, error) {
                    if (!mensajesRegistro) return;
                    mensajesRegistro.textContent = texto;
                    mensajesRegistro.style.color = error ? '#dc2626' : '#15803d';
                }

                function obtenerError(res) {
                    var data = res && res.data ? res.data : {};
                    var detalle = data.detail || data.error || data.non_field_errors;
                    if (Array.isArray(detalle)) detalle = detalle[0];
                    if (typeof detalle === 'string') return detalle;

                    var campos = ['email', 'password', 'password_confirmacion', 'nombres', 'apellidos', 'rol'];
                    for (var i = 0; i < campos.length; i++) {
                        var valor = data[campos[i]];
                        if (Array.isArray(valor) && valor.length) return String(valor[0]);
                        if (typeof valor === 'string') return valor;
                    }
                    return 'No se pudo crear la cuenta. Revisa los datos e inténtalo de nuevo.';
                }

                if (datos.password !== datos.password_confirmacion) {
                    mostrarMensaje('Las contraseñas no coinciden.', true);
                    return;
                }

                if (!window.BEC.cfg.api.registro) {
                    mostrarMensaje('La ruta de registro no está configurada.', true);
                    return;
                }

                mostrarMensaje('', false);
                if (botonRegistro) {
                    botonRegistro.disabled = true;
                    botonRegistro.textContent = 'Creando cuenta...';
                }

                window.BEC.api(window.BEC.cfg.api.registro, {
                    method: 'POST',
                    body: datos
                }).then(function(res) {
                    if (botonRegistro) {
                        botonRegistro.disabled = false;
                        botonRegistro.textContent = 'Crear Cuenta';
                    }

                    if (!res || !res.ok) {
                        mostrarMensaje(obtenerError(res), true);
                        return;
                    }

                    formRegistro.reset();
                    var vistaRegistro = document.getElementById('vistaRegistroModal');
                    var vistaLogin = document.getElementById('vistaLoginModal');
                    var emailLogin = document.getElementById('emailModal');
                    var passwordLogin = document.getElementById('passwordModal');
                    var mensajesLogin = document.getElementById('mensajesModal');

                    if (emailLogin) emailLogin.value = datos.email;
                    if (passwordLogin) passwordLogin.value = '';
                    if (vistaRegistro) vistaRegistro.style.display = 'none';
                    if (vistaLogin) vistaLogin.style.display = 'block';
                    if (mensajesLogin) {
                        mensajesLogin.textContent = 'Cuenta creada. Inicia sesión con tu correo y contraseña.';
                        mensajesLogin.style.color = '#15803d';
                    }
                }).catch(function() {
                    if (botonRegistro) {
                        botonRegistro.disabled = false;
                        botonRegistro.textContent = 'Crear Cuenta';
                    }
                    mostrarMensaje('No se pudo conectar con el servidor. Inténtalo de nuevo.', true);
                });
            });
        }

        try {
            var perfilStr = localStorage.getItem('bec_perfil');
            if (perfilStr) {
                var perfil = JSON.parse(perfilStr);
                var rol = (perfil && perfil.rol) ? perfil.rol.toUpperCase() : '';
                var navContainer = document.querySelector('.main-nav');
                if (navContainer && rol) {
                    var templateId = (rol === 'PROVEEDOR' || rol === 'PRO') ? 'tmpl-nav-proveedor' : 'tmpl-nav-cliente';
                    var template = document.getElementById(templateId);
                    if (template) {
                        navContainer.innerHTML = template.innerHTML;
                    }
                }
            }
        } catch(e) {}
    });
})();
</script>
