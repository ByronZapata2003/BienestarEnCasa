{% extends "base.html" %}

{% block title %}Iniciar Sesión - BienestarEnCasa{% endblock %}

{% block body %}
<div class="container">
    <h1>Iniciar Sesión</h1>

    <!-- Mensajes de sistema (errores de la API, avisos) -->
    <div id="mensajes" aria-live="polite"></div>

    <div class="form-container">
        <form id="form-login" novalidate>
            <!-- Campo Email -->
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" name="email" id="email" placeholder="ejemplo@correo.com"
                       autocomplete="email" required autofocus>
            </div>

            <!-- Campo Contraseña -->
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" name="password" id="password" placeholder="Ingresa tu contraseña"
                       autocomplete="current-password" required>
            </div>

            <!-- Botón de Envío -->
            <div class="form-actions">
                <button type="submit" name="login">Entrar</button>
            </div>
        </form>
    </div>

    <p>¿No tienes cuenta? <a href="{% url 'pagina-registro' %}">Regístrate aquí</a></p>

    <!-- Enlace a recuperación de contraseña (vista de Django: HU-03) -->
    <p><a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a></p>
</div>
{% endblock %}

{% block extra_body %}
<script>
(function () {
    var form = document.getElementById('form-login');

    // Si ya hay una sesión válida, no tiene sentido ver el login
    if (BEC.haySesion()) {
        BEC.requiereSesion().then(function (p) {
            if (p) { window.location.replace(BEC.inicioPorRol(p.rol)); }
        });
    }

    // Solo se permite volver a una ruta interna del sitio (evita redirecciones a sitios externos)
    function destino(perfil) {
        var next = BEC.param('next');
        if (next && next.charAt(0) === '/' && next.charAt(1) !== '/') { return next; }
        return BEC.inicioPorRol(perfil.rol);
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = form.elements.email.value.trim();
        var password = form.elements.password.value;
        if (!email || !password) {
            BEC.mensaje('Ingresa tu correo y tu contraseña.', 'error');
            return;
        }
        BEC.ocupado(form, true);
        BEC.api(BEC.cfg.api.iniciarSesion, { method: 'POST', auth: false, body: { email: email, password: password } })
            .then(function (res) {
                if (!res.ok) { BEC.mensajeError(res); BEC.ocupado(form, false); return null; }
                BEC.guardarSesion(res.data);
                return BEC.cargarPerfil(true);
            })
            .then(function (perfil) {
                if (perfil === null) { return; }
                if (!perfil) { BEC.mensaje('No se pudo cargar tu perfil. Intenta de nuevo.', 'error'); BEC.ocupado(form, false); return; }
                window.location.replace(destino(perfil));
            });
    });
})();
</script>
{% endblock %}
