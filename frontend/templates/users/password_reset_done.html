{% extends "base.html" %}

{% block title %}Correo Enviado - Bienestar en Casa{% endblock %}

{% block body %}
<div style="background-color: #f8fafc; min-height: calc(100vh - 72px); display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif;">
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 1.25rem; padding: 2.5rem 2rem; max-width: 28rem; width: 100%; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); text-align: center;">
    
    <div style="width: 3.5rem; height: 3.5rem; background-color: #dcfce7; border-radius: 9999px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem auto; color: #166534;">
      <svg style="width: 1.75rem; height: 1.75rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
      </svg>
    </div>

    <h1 style="font-size: 1.75rem; font-weight: 800; color: #0f172a; margin: 0 0 0.5rem 0;">Correo Enviado</h1>
    <p style="color: #64748b; font-size: 0.925rem; margin: 0 0 1.75rem 0; line-height: 1.5;">
      Si la dirección ingresada coincide con un usuario registrado, recibirás un correo con las instrucciones a la brevedad.
    </p>

    <a href="{% url 'pagina-inicio' %}" style="display: inline-block; width: 100%; box-sizing: border-box; background-color: #0f172a; color: #ffffff; font-weight: 700; padding: 0.85rem; border-radius: 0.75rem; text-decoration: none; font-size: 0.95rem;">
      Volver al inicio
    </a>
  </div>
</div>
{% endblock %}
